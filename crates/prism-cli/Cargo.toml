[package]
name = "rsx-prism"
description = "Command-line tool that repairs the black halo around semi-transparent images."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["image", "transparency", "alpha", "premultiplied", "roblox"]
categories = ["command-line-utilities", "multimedia::images"]

[[bin]]
name = "prism"
path = "src/main.rs"

[features]
default = ["png", "webp"]
png = ["image/png"]
webp = ["image/webp"]
# AVIF decoding links against the system dav1d library, so it is opt-in.
# Build with: cargo build --release --features avif
avif = ["image/avif", "image/avif-native"]

[dependencies]
rsx-prism-core = { workspace = true, features = ["parallel"] }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false }
indicatif = "0.17"
rayon = "1.10"
walkdir = "2.5"
